name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --break-system-packages -r requirements.txt
          pip install --break-system-packages pytest

      - name: Populate model registry (demo models for testing)
        run: python3 scripts/train_demo_models.py

      - name: Run Alembic migrations against Postgres
        env:
          DATABASE_URL: postgresql+psycopg://crm:crm@localhost:5432/crm
          ENV: local
          JWT_SECRET_KEY: ci-only-not-for-prod-32-characters-min
          FIELD_ENCRYPTION_KEY: ""
          REDIS_URL: ""
        run: python3 -m alembic upgrade head

      - name: Run test suite (SQLite, fast)
        env:
          ENV: local
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: ci-only-not-for-prod-32-characters-min
          FIELD_ENCRYPTION_KEY: ""
          REDIS_URL: ""
        run: python3 -m pytest tests/ -v

      - name: Compile-check every Python file
        run: |
          python3 - <<'PYEOF'
          import py_compile, glob, sys
          files = glob.glob('**/*.py', recursive=True)
          errors = []
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append((f, str(e)))
          if errors:
              for f, e in errors:
                  print(f'FAIL {f}\n{e}')
              sys.exit(1)
          print(f'{len(files)} files compiled cleanly')
          PYEOF

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
