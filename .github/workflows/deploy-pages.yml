name: Deploy frontend to GitHub Pages

# Builds and deploys frontend/ only — this workflow never touches the
# backend. The FastAPI backend can't run on GitHub Pages (static hosting
# only, no server process); deploy it separately (Render, per
# docs/DEPLOYMENT.md) and point VITE_API_BASE_URL at that URL below.
#
# Required repo configuration before this runs successfully:
#   1. Settings → Pages → Source → "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → New repository VARIABLE
#      named VITE_API_BASE_URL, set to your deployed backend's
#      https://<your-backend>/api/v1

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Build with the repo name as the base path
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DEMO_MODE: "true"
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Copy index.html to 404.html (SPA fallback)
        # GitHub Pages has no server-side rewrites, so a direct link to
        # e.g. /datasets/abc would 404 without this. GitHub Pages serves
        # 404.html for any unmatched path, so making it a copy of
        # index.html lets BrowserRouter take over from there.
        run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
